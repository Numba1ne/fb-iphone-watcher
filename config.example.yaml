# Copy this file to config.yaml and edit. config.yaml is gitignored.
# Secrets (tokens, webhook URLs) go in .env, never here.

search:
  query: "iphone"
  city_slug: "london"        # the Marketplace area to search
  radius_km: 25
  latitude: 51.5074          # centre of the radius. London = 51.5074, -0.1278
  longitude: -0.1278
  min_price: 100
  max_price: 1200
  # Only listings posted in the last N days. This is not just a filter: Facebook
  # ignores sortBy=creation_time_descend without it and returns listings ~15
  # hours old, badged "Just listed". 1 keeps the feed genuinely newest-first.
  # Set to 0 to remove the window (and lose the newest-first ordering).
  days_since_listed: 1
  # Escape hatch: open Marketplace in your browser, configure the search you
  # want, copy the whole URL, and paste it here. It then overrides everything
  # above. Useful if Facebook renames a URL parameter.
  search_url_override: ""

polling:
  # 30s + up to 5s jitter, plus a few seconds of page load, keeps detection
  # under a minute. Minimum 15 — anything faster risks a Facebook block.
  interval_seconds: 30
  jitter_seconds: 5          # random +/- seconds so polling isn't metronomic
  max_cards: 30              # newest-first, so the top of the page is enough
  restart_browser_every: 100 # polls between browser restarts, to free memory

browser:
  headless: true             # false to watch it work in a visible window
  user_data_dir: "data/browser-profile"
  navigation_timeout_ms: 30000

filters:
  # A listing must contain at least one of these in its title.
  require_any:
    - "iphone"
  # A listing is dropped if its title matches any of these. "locked" here does
  # NOT match "unlocked" — that's deliberate.
  exclude:
    - "for parts"
    - "parts only"
    - "spares"
    - "cracked"
    - "broken"
    - "faulty"
    - "not working"
    - "screen damage"
    - "icloud locked"
    - "activation lock"
    - "locked"
    - "blacklisted"
    - "bad imei"
    - "sold"

notifications:
  telegram: true
  discord: true
  # On the very first run, record existing listings without alerting on them.
  first_run_silent: true
  # Measurement, not alerting. Every `probe_every` polls, read the Facebook
  # notifications page and record the first moment each listing appears in a
  # saved-search alert. `python tools/notify_race.py` then compares that
  # against the poll. Costs one extra page load per probe; set false to stop.
  probe: false
  probe_every: 4

paths:
  db: "data/bot.db"
  log: "data/logs/bot.log"
  debug: "data/debug"
