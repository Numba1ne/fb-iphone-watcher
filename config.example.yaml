# Copy this file to config.yaml and edit. config.yaml is gitignored.
# Secrets (tokens, webhook URLs) go in .env, never here.

search:
  query: "iphone"
  city_slug: "london"        # the Marketplace area to search
  radius_km: 25
  latitude: 51.5074          # centre of the radius. London = 51.5074, -0.1278
  longitude: -0.1278
  min_price: 100
  max_price: 1200
  # Only listings posted in the last N days. This is not just a filter: Facebook
  # ignores sortBy=creation_time_descend without it and returns listings ~15
  # hours old, badged "Just listed". 1 keeps the feed genuinely newest-first.
  # Set to 0 to remove the window (and lose the newest-first ordering).
  days_since_listed: 1
  # Escape hatch: open Marketplace in your browser, configure the search you
  # want, copy the whole URL, and paste it here. It then overrides everything
  # above. Useful if Facebook renames a URL parameter.
  search_url_override: ""

polling:
  # Aggressive detection. 20s is about as fast as this is worth running: a poll
  # takes several seconds to load and parse, so real cadence is bounded by poll
  # duration long before it is bounded by this number. Hard minimum is 15 —
  # anything faster is a fast route to a temporary Facebook block.
  interval_seconds: 20
  jitter_seconds: 3          # random +/- seconds so polling isn't metronomic
  max_cards: 30              # newest-first, so the top of the page is enough
  # Restart Chromium every N polls. Frequent restarts shed per-profile
  # staleness and memory growth, which matter on a 24/7 run. 15–25 is the
  # useful range; 0 disables it.
  restart_browser_every: 20

freshness:
  # A second search with slightly different parameters, merged into the same
  # poll and de-duplicated by listing id. This catches listings whose price or
  # distance the primary search's parameters exclude. Set false to poll once.
  second_search: true
  second_search_radius_km: 40         # usually wider than search.radius_km
  second_search_drop_max_price: true  # secondary ignores search.max_price

browser:
  headless: true             # false to watch it work in a visible window
  user_data_dir: "data/browser-profile"
  navigation_timeout_ms: 30000

filters:
  # A listing must contain at least one of these in its title.
  require_any:
    - "iphone"
  # A listing is dropped if its title matches any of these. "locked" here does
  # NOT match "unlocked" — that's deliberate.
  exclude:
    - "for parts"
    - "parts only"
    - "spares"
    - "cracked"
    - "broken"
    - "faulty"
    - "not working"
    - "screen damage"
    - "icloud locked"
    - "activation lock"
    - "locked"
    - "blacklisted"
    - "bad imei"
    - "sold"

notifications:
  telegram: true
  discord: true
  # The first poll after every start is a warm-up. After a night off the page
  # is full of yesterday's listings, and replaying them is noise. Each newcomer
  # has its real age read anyway, so a listing posted while the bot was down is
  # still announced; everything else is recorded silently and shown under
  # All seen. With max_age_minutes set to 0 nothing can be proven fresh, so a
  # warm-up announces nothing.
  first_run_silent: true

  # Only alert if the listing is at most this many minutes old. Defaults to 8;
  # 0 (or null) disables the filter and alerts on everything new.
  #
  # When a listing is new to us, the bot opens its detail page once to read the
  # real age — the search card badges everything "Just listed". The listing is
  # still recorded and shown on the dashboard when it is too old; only the
  # Telegram/Discord alert is suppressed. Coarse wording ("today",
  # "yesterday") counts as too old. If the age genuinely cannot be read it
  # alerts anyway, so a parsing change never silently swallows listings.
  max_age_minutes: 8

  # Saved-search probe. Requires a saved search created on the account
  # (python tools/save_search.py). Every `probe_every` polls, read the Facebook
  # notifications page.
  probe: false
  # Alert straight from a notification, before the search poll sees the item.
  # This is the fastest possible path, but a notification carries only text,
  # so filters run against that text. Off by default; a claimed id stops the
  # next poll alerting the same listing twice.
  alert_from_probe: false
  probe_every: 2

paths:
  db: "data/bot.db"
  log: "data/logs/bot.log"
  debug: "data/debug"
